[package]
name = "process-sanskrit-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
process-sanskrit-splitter-core = { path = "../splitter-core" }
pyo3 = { version = "=0.28.2", features = ["abi3-py39", "extension-module"] }

[build-dependencies]
cc = "1.2"
pyo3-build-config = "=0.28.2"
