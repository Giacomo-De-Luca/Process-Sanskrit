[build-system]
requires = ["setuptools>=42", "requests"]
build-backend = "setuptools.build_meta"

[project]
name = "process-sanskrit"
version = "1.1.0"
description = "Process-Sanskrit is python library for automatic Sanskrit text annotation and inflected dictionary search"
readme = "README.md"
authors = [
    {name = "Giacomo De Luca", email = "giacomo.deluca@hotmail.it"}
]
requires-python = ">=3.9"
urls = {Repository = "https://github.com/Giacomo-De-Luca/Process-Sanskrit"}
dependencies = [
    "requests>=2.20.0",
    "sqlalchemy>=1.4.33",
    "indic_transliteration>=2.0.0",
    "regex>=2022.0.0",
    "python-dotenv>=0.19.0",
    # Sandhi splitting. Formerly sanskrit-parser==0.2.6, now vendored in
    # process_sanskrit/splitter/ -- see that package's NOTICE.md. These are the
    # only runtime deps that subset actually needs.
    "networkx>=2.5",
    "marisa-trie>=1.0",
    "numpy>=1.21",
    "sentencepiece>=0.1.95",
]

[project.optional-dependencies]

byt5 = [
    "torch>=1.9.0",
    "transformers>=4.5.0",
    "numpy>=2.0.0",
    "scipy>=1.13.0"
]


[project.scripts]
update-ps-database = "process_sanskrit.setup.updateDB:update_database"

[tool.setuptools.package-data]
"process_sanskrit.resources" = ["*.json", "*.csv", "*.tsv", "*.xlsx"]
"process_sanskrit.splitter" = ["LICENSE.upstream", "NOTICE.md", "data/*"]
"tests" = ["*.py", "*.json", "*.txt"]

[tool.setuptools]
include-package-data = true

# Declare the packages explicitly. Flat-layout auto-discovery scans the working
# tree, so any stray top-level directory (a scratch checkout, a notebook dir)
# breaks the build with "Multiple top-level packages discovered".
[tool.setuptools.packages.find]
include = ["process_sanskrit*"]
