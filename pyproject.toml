[build-system]
requires = ["setuptools>=77", "setuptools-rust>=1.12,<2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "process-sanskrit"
version = "1.5.1"
description = "Process-Sanskrit is python library for automatic Sanskrit text annotation and inflected dictionary search"
readme = "README.md"
license = "CC-BY-NC-ND-4.0"
license-files = [
    "LICENSE.md",
    "THIRD_PARTY_NOTICES.md",
    "process_sanskrit/splitter/LICENSE.*",
    "process_sanskrit/splitter/NOTICE.md",
]
authors = [
    {name = "Giacomo De Luca", email = "giacomo.deluca@hotmail.it"}
]
requires-python = ">=3.9"
urls = {Repository = "https://github.com/Giacomo-De-Luca/Process-Sanskrit"}
dependencies = [
    "requests>=2.20.0",
    "sqlalchemy>=1.4.33",
    "indic_transliteration>=2.0.0",
    "regex>=2022.0.0",
    "python-dotenv>=0.19.0",
    # Sandhi splitting. Formerly sanskrit-parser==0.2.6, now vendored in
    # process_sanskrit/splitter/ -- see that package's NOTICE.md. These are the
    # only runtime deps that subset actually needs.
    "networkx>=2.5",
    "marisa-trie>=1.0",
    "numpy>=1.21",
    "sentencepiece>=0.1.95,<0.3",
]

[project.optional-dependencies]

byt5 = [
    "torch>=1.9.0",
    "transformers>=4.5.0",
    "numpy>=2.0.0",
    "scipy>=1.13.0"
]


[project.scripts]
update-ps-database = "process_sanskrit.setup.updateDB:update_database"

[tool.setuptools.package-data]
"process_sanskrit.resources" = ["*.json", "*.csv", "*.tsv", "*.xlsx"]
"process_sanskrit.splitter" = [
    "LICENSE.upstream",
    "LICENSE.sentencepiece",
    "LICENSE.protobuf-lite",
    "LICENSE.darts-clone",
    "NOTICE.md",
    "data/*",
    "data/native/*",
]
"tests" = ["*.py", "*.json", "*.txt"]

[tool.setuptools]
include-package-data = true

# Declare the packages explicitly. Flat-layout auto-discovery scans the working
# tree, so any stray top-level directory (a scratch checkout, a notebook dir)
# breaks the build with "Multiple top-level packages discovered".
[tool.setuptools.packages.find]
include = ["process_sanskrit*"]

[[tool.setuptools-rust.ext-modules]]
target = "process_sanskrit.splitter._native"
path = "rust/python/Cargo.toml"
binding = "PyO3"
debug = false
optional = false
quiet = true
cargo-manifest-args = ["--locked"]

[tool.cibuildwheel]
build = "cp39-*"
skip = "*-musllinux*"
build-frontend = "build"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux2014"
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.87.0"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
archs = ["AMD64"]
