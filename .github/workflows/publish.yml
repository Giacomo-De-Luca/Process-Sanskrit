name: Publish to PyPI

# Publishes whenever the version in pyproject.toml differs from what is on PyPI.
# Pushes that do not bump the version end green without uploading anything.
# See documentation/publishing.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: two pushes in quick succession must not race to upload
# the same version. Never cancel a run mid-upload.
concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  check-version:
    name: Check version against PyPI
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should-publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        run: python .github/scripts/check_pypi_version.py

  build-wheels:
    name: Build and validate native wheels
    needs: check-version
    if: needs.check-version.outputs.should-publish == 'true'
    uses: ./.github/workflows/wheels.yml

  build-sdist:
    name: Build and validate source distribution
    needs: check-version
    if: needs.check-version.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.87.0 --profile minimal
          rustup default 1.87.0

      - name: Build and check sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist --outdir sdist
          python -m twine check sdist/*

      - name: Verify sdist native sources and notices
        run: >-
          python -c
          "from pathlib import Path;
          import tarfile;
          archives = list(Path('sdist').glob('*.tar.gz'));
          assert len(archives) == 1, archives;
          names = tarfile.open(archives[0], 'r:gz').getnames();
          required = ('Cargo.lock', 'Cargo.toml', 'THIRD_PARTY_NOTICES.md', 'benchmarks/splitter-benchmark.json', 'documentation/rust-splitter.md', 'rust/python/Cargo.toml', 'process_sanskrit/splitter/LICENSE.sentencepiece', 'scripts/benchmark_splitter.py', 'tools/build_splitter_data.py');
          assert all(any(name.endswith('/' + required_name) for name in names) for required_name in required), names"

      - name: Build native wheel from sdist
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir sdist-smoke-wheel sdist/*.tar.gz
          wheels=(sdist-smoke-wheel/*.whl)
          [[ -e "${wheels[0]}" && "${#wheels[@]}" -eq 1 ]]
          [[ "$(basename "${wheels[0]}")" == *-cp39-abi3-* ]]

      - name: Smoke-test wheel rebuilt from sdist
        shell: bash
        run: |
          python -m venv sdist-smoke-venv
          sdist-smoke-venv/bin/python -m pip install sdist-smoke-wheel/*.whl
          mkdir -p sdist-smoke
          cd sdist-smoke
          ../sdist-smoke-venv/bin/python - <<'PY'
          from pathlib import Path

          import process_sanskrit as ps
          from process_sanskrit.splitter import Parser, _native

          assert any(
              part.lower() == "site-packages" for part in Path(ps.__file__).parts
          ), ps.__file__
          assert ps.transliterate("rāmaḥ", "devanagari") == "रामः"
          assert _native.BUILD_PROFILE == 'release'
          result = Parser(input_encoding="slp1", output_encoding="slp1").split(
              "astyuttarasyAMdiSi", limit=1
          )
          assert result and [token.canonical() for token in result[0].split] == [
              "asti", "uttarasyAm", "diSi"
          ]
          PY

      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: sdist/*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  collect-distributions:
    name: Collect checked release distributions
    needs: [check-version, build-wheels, build-sdist]
    if: needs.check-version.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all native wheels
        uses: actions/download-artifact@v6
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v6
        with:
          name: sdist
          path: dist

      - name: Verify complete release set
        shell: bash
        run: |
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          [[ -e "${wheels[0]}" && "${#wheels[@]}" -eq 4 ]]
          [[ -e "${sdists[0]}" && "${#sdists[@]}" -eq 1 ]]
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload complete release set
        uses: actions/upload-artifact@v6
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: [check-version, collect-distributions]
    if: needs.check-version.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/process-sanskrit
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC); no API token
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    name: Tag the release
    needs: [check-version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag v${{ needs.check-version.outputs.version }}
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          # The upload already succeeded by this point. A retry may find the
          # correct tag already present, but a stale/pre-created tag must fail.
          if remote_tag_lines="$(git ls-remote --exit-code --tags origin \
            "refs/tags/v${VERSION}" "refs/tags/v${VERSION}^{}" 2>/dev/null)"; then
            remote_commit="$(printf '%s\n' "${remote_tag_lines}" | awk '
              NR == 1 { direct = $1 }
              /\^\{\}$/ { peeled = $1 }
              END { print peeled != "" ? peeled : direct }
            ')"
            if [[ "${remote_commit}" == "${EXPECTED_COMMIT}" ]]; then
              echo "Tag v${VERSION} already points to ${EXPECTED_COMMIT}; nothing to do."
              exit 0
            fi
            echo "Tag v${VERSION} points to ${remote_commit}, expected ${EXPECTED_COMMIT}." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
